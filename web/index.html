<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Train tracker</title>
    <style>
      html, body, #app, #map { height: 100%; margin: 0; }
      body { background: #05070d; color: #e3e9ef; font: 14px ui-monospace, 'Cascadia Mono', Consolas, monospace; }
      #live, #panel { background: #05070ddd; border: 1px solid #00c8ff66; box-shadow: 0 0 18px #00c8ff22; }
      #live { position: absolute; top: 16px; left: 16px; padding: 12px; border-radius: 4px; }
      #live strong { color: #ff2a6d; text-shadow: 0 0 8px #ff2a6daa; } #connection { margin-top: 4px; }
      #panel { position: absolute; bottom: 16px; right: 16px; max-height: 65%; overflow: auto;
        width: min(540px, calc(100% - 64px)); padding: 16px; border-radius: 4px; }
      button { float: right; padding: 6px 12px; cursor: pointer; font: inherit; }
      table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #344252; }
      h2 { font-size: 18px; margin-right: 70px; }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="map" aria-label="India train map"></div>
      <div id="live"><strong>LIVE</strong> · now − 15 s<div id="connection" role="status">Loading network…</div></div>
      <aside id="panel" aria-label="Train predictions" hidden><button type="button">Close</button><div data-content aria-live="polite"></div></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
