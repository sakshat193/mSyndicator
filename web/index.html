<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05070d">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Track trains across India with live positions, delays and arrival predictions.">
    <title>Train tracker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2300f0ff'/%3E%3C/svg%3E">
  </head>
  <body data-hud="shown">
    <main id="app">
      <div id="map" aria-label="India train map"></div>
      <section id="live" class="glass" aria-label="Live train tracker">
        <div class="live-heading">
          <strong class="live-label"><span class="live-dot" aria-hidden="true"></span>LIVE</strong>
          <span id="train-count">Loading…</span>
          <button id="hud-toggle" class="glass" type="button" aria-label="Hide overlays" aria-pressed="false" title="Toggle overlays (H)">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m3 3 18 18M10.5 5.1A12 12 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.8M6.2 6.2A19 19 0 0 0 2 12s3.5 7 10 7a12 12 0 0 0 5.8-1.8M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
        <div class="live-status"><time id="clock" aria-label="Current time in IST">--:--:--</time><span id="connection" role="status">Loading network…</span></div>
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <label class="sr-only" for="search">Train number or name</label>
          <input id="search" type="search" placeholder="Train number or name" maxlength="100" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false">
        </div>
        <div id="search-results" role="listbox" aria-label="Trains" hidden></div>
      </section>
      <section id="legend" class="glass" aria-label="Train delay legend">
        <div class="delay-gradient" aria-hidden="true"></div>
        <div class="legend-labels"><span>On time</span><span>15 min</span><span>60+ min late</span></div>
      </section>
      <aside id="panel" class="glass" aria-label="Train predictions" tabindex="-1" hidden>
        <button class="panel-close" data-close type="button" aria-label="Close train panel">×</button>
        <div data-content aria-live="polite"></div>
      </aside>
      <div id="hover" class="glass" role="tooltip" hidden>
        <strong data-hover-title></strong><p class="route-name" data-hover-route></p>
        <div class="hover-metadata"><span class="delay-chip" data-hover-delay></span><span class="evidence" data-hover-evidence></span></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
