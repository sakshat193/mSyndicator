services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: msynd
      POSTGRES_PASSWORD: msynd
      POSTGRES_DB: msynd
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msynd"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  pgdata:
