          - heading "Train Running Status:" [level=2] [ref=e262]
          - paragraph [ref=e263]: The real time tracking of GPS enabled trains in Indian railways is known as train running status of the train. Basically, it gives information about the last reported location of the train with estimated arrival time and estimated departure time for next upcoming railway stations in the route of that respective train. This Spot your train feature also gives information about the platform number on which train will arrive. Train running status is pretty accurate & gives real time status of the train with usually delay upto maximum 5 minutes. Live train status can be checked for all Indian trains that run under Indian Railways Reservations system.
          - paragraph [ref=e264]: "Checking Train running status is important for both kind of railway passengers: one who still have to board the train and the others who are already on their train journey. For first set, live train status is important as they want to be updated about the Estimated time of arrival of their train at their respective station, so that they can reach the station at the right time. For second set of passengers, train running status is critical as they want to be updated about that at what time they will reach there destination so that they can plan accordingly."
          - paragraph [ref=e265]:
            - strong [ref=e266]: "How to Spot your train or check Live Train Status:"
          - paragraph [ref=e267]: Best way to check train running status is either from Goibibo website or mobile app. Goibibo in collaboration with Indian Railways and IRCTC offers quick and easy facility to check the live train running status of your respective train. As a first step, enter the train number or train name in the search box for which live train enquiry is required. Goibibo's quick auto-suggest feature helps in quickly suggesting the train for which user is intending to check Live train status, on just entering 2-3 characters. Next step in checking train running status is to select the date for which user wants to do live train enquiry. Basis the selected train, Goibibo also shows the list of stations which this respective train covers. Selecting a specific train station is optional and is recommended if the user wants to check the running status of the train for a particular station only. Once these details are entered, click on Get Status button to check the live train status of your train.
          - paragraph [ref=e268]:
            - strong [ref=e269]: "What all Details come on checking Live Train Running Status:"
          - paragraph [ref=e270]: "From Live Train Running Status, you will get all details about the train including how much the train is delayed and estimated time of arrival to the upcoming station. Live Train Enquiry provides following information about the train journey:"
          - list [ref=e271]:
            - listitem [ref=e272]:
              - paragraph [ref=e273]: It Shows all stations which the respective train covers in its complete journey. It shows the stations in the sequential order, starting with the Origin station and ending with the destination station
            - listitem [ref=e274]:
              - paragraph [ref=e275]: For each station, it shows the arrival time of the train on that station and also the departure time of the train from that station
            - listitem [ref=e276]:
              - paragraph [ref=e277]: It also shows the amount of time for which train halted at a particular station
            - listitem [ref=e278]:
              - paragraph [ref=e279]: Also, it shows the Delay time (if any) of all stations it has covered in its journey
            - listitem [ref=e280]:
              - paragraph [ref=e281]: For stations, which train is yet to cover, it shows the Estimated Time of Arrival and Estimated Time of Departure basis the current running status of the train
          - paragraph [ref=e282]:
            - strong [ref=e283]: "Popular Trains for checking Live Train Running Status:"
          - paragraph [ref=e284]: "Some of the popular trains for which passengers usually track their running status are as follows:"
