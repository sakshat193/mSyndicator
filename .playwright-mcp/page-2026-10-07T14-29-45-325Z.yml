        - heading "FAQs about Live Train Running Status" [level=2] [ref=e310]
        - generic [ref=e311] [cursor=pointer]:
          - checkbox "What is Live Train Running Status? ❯" [checked] [ref=e312]
          - generic [ref=e313]:
            - paragraph [ref=e315]:
              - strong [ref=e316]: What is Live Train Running Status?
            - text: ❯
          - paragraph [ref=e319]: Live train status is a means to track the train running status, to check its current location, its estimated arrival and departure at any station en-route. Through this, you can also check the real-time delay of the train. Through live train status, you would be able to analyze whether your train is running on time or not or would there be any delay in reaching for your train to your destination. For Live train status and train ticket booking use Goibibo.
        - generic [ref=e320] [cursor=pointer]:
          - checkbox "Why it is beneficial to check Live Train running status? ❯" [checked] [ref=e321]
          - generic [ref=e322]:
            - paragraph [ref=e324]:
              - strong [ref=e325]: Why it is beneficial to check Live Train running status?
            - text: ❯
          - paragraph [ref=e328]: The status of running trains usually changes because of any delay or halt. So instead of running back and forth to the helpdesk of the crowded railway station, you can now easily do the train enquiry on your phone via app or Goibibo website. With the help of Live Train Status, you can easily spot your train & can know the arrival and departure time of your train. You must frequently check the updates before boarding the train and as the arrival time comes nearer, you will be able to locate your train more accurately.
        - generic [ref=e329] [cursor=pointer]:
          - checkbox "How to check the live train running status on phone or via SMS? ❯" [checked] [ref=e330]
          - generic [ref=e331]:
            - paragraph [ref=e333]:
              - strong [ref=e334]: How to check the live train running status on phone or via SMS?
            - text: ❯
          - paragraph [ref=e337]: "If you want to check the live train running status on your phone via SMS then you all you need is your train number and the STD code of the station. Type AD XXXXX YYYY and send it to 139. XXXXX five-digit train number and YYYY is your STD code. E.g.: AD 12434 0592 Remember, this SMS service is run by the Indian railways and is not free. You will be charged a very small amount if you use it."
        - generic [ref=e338] [cursor=pointer]:
          - checkbox "What could be the possible reasons for not getting the information on train running status? ❯" [checked] [ref=e339]
          - generic [ref=e340]:
            - paragraph [ref=e342]:
              - strong [ref=e343]: What could be the possible reasons for not getting the information on train running status?
            - text: ❯
          - generic [ref=e345]:
            - paragraph [ref=e346]: "Sometimes, Spot your train feature does not gives you the required information. This could be due to any of the following reasons:"
            - list [ref=e347]:
              - listitem [ref=e348]:
                - paragraph [ref=e349]: Specified train number or train name is not valid and hence train running status is not available
              - listitem [ref=e350]:
                - paragraph [ref=e351]: Specified Train does not run on the selected date
              - listitem [ref=e352]:
                - paragraph [ref=e353]: Sometimes due to network issue or congestion, information is not fetched from the Indian Railways system
              - listitem [ref=e354]:
                - paragraph [ref=e355]: If you are checking train running status through your mobile or laptop via internet connection, then due to low or no internet network on your device, this information is not fetched
        - generic [ref=e356] [cursor=pointer]:
          - checkbox "How can I check Live Train running status on Goibibo? ❯" [checked] [ref=e357]
          - generic [ref=e358]:
            - paragraph [ref=e360]:
              - strong [ref=e361]: How can I check Live Train running status on Goibibo?
            - text: ❯
          - paragraph [ref=e364]: You can easily check your train running status on Goibibo. First of all, go to the Goibibo website or open the app. Next, click on the tab of IRCTC Trains and on the right side, you will see the tab of Train Running Status. After clicking on it, you will get three columns to fill, respectively, train number, station and the start date of the train. Once you fill these columns, you can click on the Check Status. You will be directed to the page containing the train's schedule, the expected arrival and departure time from any particular station along with the halt time. Once the train departs, you can easily check live train running status on the app or the website after a few minutes.
